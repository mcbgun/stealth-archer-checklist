<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stealth Archer — Quick & Dirty Checklist</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #0d1117; color: #c9d1d9; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        .container { max-width: 700px; }
        h1 { color: #f0c060; font-size: 1.4rem; }
        h2 { color: #58a6ff; font-size: 1rem; border-bottom: 1px solid #21262d; padding-bottom: 4px; margin-top: 20px; }
        .phase-badge { font-size: 0.7rem; padding: 2px 8px; border-radius: 10px; }
        .form-check { padding: 6px 12px 6px 36px; border-radius: 6px; margin: 2px 0; position: relative; }
        .form-check:hover { background: #161b22; }
        .form-check-input { margin-left: -24px; margin-top: 4px; cursor: pointer; }
        .form-check-input:checked { background-color: #3fb950; border-color: #3fb950; }
        .form-check-label { font-size: 0.85rem; cursor: pointer; }
        .form-check-input:checked + .form-check-label { color: #8b949e; text-decoration: line-through; }
        .stats-bar { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 10px 16px; margin-bottom: 16px; display: flex; justify-content: space-between; font-size: 0.8rem; }
        .stat { color: #8b949e; }
        .stat strong { color: #c9d1d9; }
        .btn-reset { font-size: 0.75rem; padding: 2px 10px; }
        .tip { font-size: 0.75rem; color: #8b949e; padding: 4px 12px; border-left: 2px solid #30363d; margin: 4px 0 4px 12px; }
        .video-link { font-size: 0.75rem; color: #58a6ff; text-decoration: none; margin-left: 8px; }
        .video-link:hover { text-decoration: underline; }
        .section-progress { height: 3px; background: #21262d; border-radius: 2px; margin: 4px 0 8px; overflow: hidden; }
        .section-progress-bar { height: 100%; background: #3fb950; border-radius: 2px; transition: width 0.3s; }
        .progress-container { position: sticky; top: 0; z-index: 100; background: #0d1117; padding: 12px 0; border-bottom: 1px solid #21262d; margin-bottom: 12px; }
        .total-progress { height: 6px; background: #21262d; border-radius: 3px; overflow: hidden; }
        .total-progress-bar { height: 100%; background: linear-gradient(90deg, #3fb950, #58a6ff, #f0c060); border-radius: 3px; transition: width 0.5s; }
    </style>
</head>
<body>
<div class="container py-3">
    <h1>🏹 Stealth Archer — Quick & Dirty Checklist</h1>
    <p class="text-secondary small">Based on the Quick & Dirty Stealth Archer Build walkthrough series. No crafting, no enchanting, kicking butt by level 10.</p>

    <div class="progress-container">
        <div class="d-flex justify-content-between small mb-1">
            <span class="text-secondary">Progress</span>
            <span class="text-secondary"><span id="total-count">0</span>/<span id="total-items">0</span> (<span id="total-pct">0</span>%)</span>
        </div>
        <div class="total-progress">
            <div class="total-progress-bar" id="total-bar" style="width: 0%;"></div>
        </div>
    </div>

    <div id="checklist"></div>

    <div class="text-center mt-4 mb-3">
        <button class="btn btn-sm btn-outline-secondary btn-reset" onclick="resetAll()">Reset All</button>
    </div>
</div>

<script>
    // ── Checklist data ──
    const sections = [
        {
            name: "Build Setup",
            items: [
                { id: "race", label: "Choose Race: Bosmer (Wood Elf)", tip: "+10 Archery, Command Animal power. Alternative: Khajiit for Night Eye." },
                { id: "stone", label: "Activate The Thief Stone at Guardian Stones", tip: "Boosts Archery, Sneak, Light Armor, Lockpicking, Pickpocket by +20%." },
                { id: "skills-top", label: "Prioritize Archery → Sneak → Light Armor as top 3 skills", tip: "Archery for damage, Sneak for multipliers, Light Armor for survival." },
                { id: "perk-overdraw", label: "Take Overdraw 1/5 (+20% bow damage)", tip: "First perk point. Every rank adds 20% bow damage." },
            ]
        },
        {
            name: "Part 1 — Early Game (Helgen to Riverwood)",
            items: [
                { id: "helgen-escape", label: "Escape Helgen with Hadvar or Ralof", tip: "Loot everything in the keep. Follow whoever you choose." },
                { id: "alvor-sell", label: "Sell loot to Alvor in Riverwood", tip: "Sell weapons, armor, and items. Buy a bow and arrows if needed." },
                { id: "riverwood-trader", label: "Visit Riverwood Trader — buy Faendal's bow training", tip: "Faendal can train Archery up to 50. Take his training, then take your gold back from his house. Free Archery levels!" },
                { id: "ember-clear", label: "Clear Embershard Mine", tip: "South of Riverwood. ~100g from loot. Good early smithing materials." },
                { id: "perk-eagle", label: "Take Eagle Eye perk (zoom while aiming)", tip: "Hold block/aim button to zoom. Helps with long-range shots." },
            ]
        },
        {
            name: "Part 2 — Whiterun & The Golden Claw",
            items: [
                { id: "whiterun", label: "Head to Whiterun — report to Jarl Balgruuf", tip: "Follow the main quest to start Bleak Falls Barrow quest." },
                { id: "farengar-conjure", label: "Buy Conjure Familiar from Farengar (if conjuration build)", tip: "150g. Use to summon distractions during fights." },
                { id: "bleak-falls", label: "Clear Bleak Falls Barrow", tip: "Get the Dragonstone + Golden Claw. First draugr dungeon — go slow." },
                { id: "perk-stealth1", label: "Take Stealth 1/5 (+20% harder to detect)", tip: "Essential. Reduces detection radius significantly." },
                { id: "lucan-reward", label: "Return Golden Claw to Lucan Valerius — get 200g reward + Speech XP", tip: "Also increases merchant prices in Riverwood permanently." },
            ]
        },
        {
            name: "Part 3 — The Grind (Levels 1-10)",
            items: [
                { id: "halted-stream", label: "Clear Halted Stream Camp", tip: "Northwest of Whiterun. Get Transmute Mineral Ore spell tome." },
                { id: "silent-moons", label: "Clear Silent Moons Camp", tip: "West of Whiterun. Get the Silent Moons Enchanted weapon." },
                { id: "white-river", label: "Clear White River Watch", tip: "East of Whiterun. Named bandits with better loot." },
                { id: "reden-redoran", label: "Clear Redoran's Retreat", tip: "Quickest bandit cave. West of Whiterun." },
                { id: "perk-deadly-aim", label: "Take Deadly Aim (sneak bow attacks do 3x damage)", tip: "This is your core damage perk. Sneak + bow = 3x damage." },
                { id: "faendal-train2", label: "Train Archery with Faendal again (up to 50)", tip: "Each level costs gold but is worth it. Pickpocket gold back from his house." },
                { id: "perk-overdraw2", label: "Take Overdraw 2/5", tip: "Another +20% bow damage. Stacking." },
            ]
        },
        {
            name: "Part 4 — Mid Game Power Spike (Levels 10-15)",
            items: [
                { id: "perk-stealth2", label: "Take Stealth 2/5", tip: "Further detection reduction." },
                { id: "valtheim", label: "Clear Valtheim Towers", tip: "Toll-collection camp on the road between Whiterun and Windhelm." },
                { id: "ustengrav", label: "Clear Ustengrav", tip: "Main quest dungeon. Get the Horn of Jurgen Windcaller (well, a note)." },
                { id: "perk-power-shot", label: "Take Power Shot (stagger with bow)", tip: "Staggers enemies on hit. Keeps melee enemies at range." },
                { id: "perk-critical", label: "Take Critical Shot 1/3 (10% crit chance)", tip: "Free extra damage. Crits with sneak attacks are devastating." },
            ]
        },
        {
            name: "Part 5 — Froki's Bow & Endgame Prep (Levels 15-20)",
            items: [
                { id: "froki-quest", label: "Start Froki's Bow quest (Kyne's Sacred Trials)", tip: "Froki is southeast of Ivarstead. Completing his trials gives the Froki's Bow unique item." },
                { id: "froki-trial1", label: "Complete trial: Bear + Sabre Cat + Frost Troll", tip: "Use terrain to your advantage. Kite the troll with arrows." },
                { id: "froki-trial2", label: "Complete trial: Hagraven + Spiders + Spriggan", tip: "Bring fire arrows for the spriggan. Poison arrows for the hagraven." },
                { id: "froki-bow", label: "Froki's Bow reward — gives 15% bonus damage to animals", tip: "Best early unique bow. Also get the Gauldur Amulet piece while nearby." },
                { id: "perk-quick-shot", label: "Take Quick Shot (faster bow draw)", tip: "Faster fire rate = more DPS. Essential for taking down multiple enemies." },
                { id: "perk-hunter-disc", label: "Take Hunter's Discipline (2x arrows from bodies)", tip: "Never run out of arrows again. Saves endless gold." },
            ]
        },
        {
            name: "Major Quests & Shouts",
            items: [
                { id: "shout-fus", label: "Learn Fus (Unrelenting Force) — Bleak Falls Barrow word wall", tip: "First word. Stagger is useful even at level 1." },
                { id: "shout-wuld", label: "Learn Wuld (Whirlwind Sprint) — Dustman's Cairn word wall", tip: "Essential for evading enemies and closing gaps." },
                { id: "companions-join", label: "Join the Companions in Whiterun", tip: "Free training, good early gear, and werewolf transformation." },
                { id: "companions-proving", label: "Companions quest: Proving Honor (Dustman's Cairn)", tip: "Unique Silver Hand weapons + Farkas as follower." },
                { id: "dark-brotherhood", label: "Join Dark Brotherhood (optional — great for stealth)", tip: "Shadowmere horse + great stealth gear + lucrative contracts." },
                { id: "thieves-guild", label: "Join Thieves Guild in Riften", tip: "Fences to sell stolen goods, Nightingale armor for stealth." },
            ]
        },
        {
            name: "Gear & Items",
            items: [
                { id: "gear-bow-hunting", label: "Get a Hunting Bow (base) — sold at Riverwood Trader", tip: "Better than the Long Bow. ~50g." },
                { id: "gear-bow-imperial", label: "Upgrade to Imperial Bow or Nord Hero Bow", tip: "Better damage. Found on higher-level bandits." },
                { id: "gear-armor-leather", label: "Get full Leather or Scaled armor set", tip: "Light Armor. Scaled is better — found on higher-level bandits." },
                { id: "gear-boots-muffle", label: "Get Muffle Boots (any Light Armor)", tip: "Sneak 100 without perks. Disenchant or buy at Radiant Raiment (Solitude)." },
                { id: "gear-shrouded", label: "Collect Shrouded Armor set (Dark Brotherhood)", tip: "Best pre-20 stealth gear. +35% bow damage on the gloves." },
                { id: "gear-gauldur", label: "Collect Gauldur Amulet (+30 to all stats)", tip: "Geirmund's Hall, Folgunthur, Saarthal. Worth the trip." },
            ]
        },
    ];

    // ── Render ──
    function render() {
        const container = document.getElementById('checklist');
        let html = '';
        let total = 0, done = 0;

        sections.forEach(section => {
            let secDone = 0;
            let secHtml = '';
            section.items.forEach(item => {
                const checked = localStorage.getItem('sac-' + item.id) === 'true' ? 'checked' : '';
                if (checked) secDone++;
                secHtml += `
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="${item.id}" ${checked} onchange="saveState()">
                        <label class="form-check-label" for="${item.id}">
                            ${item.label}
                            ${item.tip ? '<br><small class="tip">💡 ' + item.tip + '</small>' : ''}
                        </label>
                    </div>`;
                total++;
            });
            done += secDone;
            const pct = section.items.length > 0 ? Math.round(secDone / section.items.length * 100) : 0;
            html += `
                <h2>${section.name}</h2>
                <div class="section-progress"><div class="section-progress-bar" style="width:${pct}%"></div></div>
                ${secHtml}`;
        });

        container.innerHTML = html;

        // Update totals
        document.getElementById('total-count').textContent = done;
        document.getElementById('total-items').textContent = total;
        const totalPct = total > 0 ? Math.round(done / total * 100) : 0;
        document.getElementById('total-pct').textContent = totalPct;
        document.getElementById('total-bar').style.width = totalPct + '%';
    }

    function saveState() {
        sections.forEach(s => {
            s.items.forEach(item => {
                const el = document.getElementById(item.id);
                if (el) localStorage.setItem('sac-' + item.id, el.checked);
            });
        });
        render();
    }

    function resetAll() {
        if (!confirm('Reset all progress?')) return;
        sections.forEach(s => {
            s.items.forEach(item => {
                localStorage.removeItem('sac-' + item.id);
            });
        });
        render();
    }

    render();
</script>
</body>
</html>
